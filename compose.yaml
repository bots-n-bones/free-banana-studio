services:
  studio:
    build: .
    restart: unless-stopped
    environment:
      STUDIO_WORKER_KEY: ${STUDIO_WORKER_KEY:?Set STUDIO_WORKER_KEY}
      STUDIO_PASSWORD: ${STUDIO_PASSWORD:?Set STUDIO_PASSWORD}
      STUDIO_SESSION_KEY: ${STUDIO_SESSION_KEY:?Set STUDIO_SESSION_KEY}
    volumes:
      - studio-data:/data
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3).close()"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  studio-data:
